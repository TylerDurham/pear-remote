[project]
name = "napple-tvd"
version = "0.1.0"
description = "pyatv bridge that exposes an Apple TV remote over local HTTP + SSE for the Noctalia napple-tv plugin"
readme = "README.md"
authors = [
    { name = "Tyler Durham", email = "2191002+TylerDurham@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "pyatv>=0.18.0",
    "srptools<2",
]

[project.scripts]
napple-tvd = "napple_tvd:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
